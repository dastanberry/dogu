<style>
:root{--bg:#F4F1EA;--paper:#FBFAF6;--sand:#EDE8DD;--line:#E0DACE;--ink:#1B1B1A;--ink2:#3D3A34;--muted:#5B574F;--sun:#C8381F;--sun-btn:#B8321F;--sun-soft:#E26A55;--dark-text:#C8C2B5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:inherit}
a:hover{color:var(--sun-btn)}
h1,h2,h3,.disp{font-family:Manrope,Inter,sans-serif;letter-spacing:-.02em;line-height:1.08;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.eyebrow{margin:0 0 10px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:500 15px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{color:var(--bg);opacity:.9}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--sun-btn);border-color:var(--sun-btn);color:#fff}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;padding-bottom:16px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo span{font-family:Manrope,sans-serif;font-weight:700;font-size:22px;letter-spacing:.2em}
nav.main{display:flex;flex-wrap:wrap;align-items:center;gap:22px;font-size:14px}
nav.main a{text-decoration:none}
.cart-btn{border:1px solid var(--ink);background:transparent;min-height:44px;padding:0 16px;font:600 14px Inter,sans-serif;cursor:pointer;color:var(--ink)}

/* hero */
.hero{display:flex;flex-wrap:wrap;gap:48px;align-items:center;padding:56px 0 88px}
.hero .txt{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:24px}
.hero h1{font-size:clamp(38px,5.4vw,60px);font-weight:600}
.hero p.lead{margin:0;font-size:18px;color:var(--ink2);max-width:500px}
.hero .art-wrap{flex:1 1 420px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:12px}

/* dark band */
.band{position:relative;background:var(--ink);color:var(--bg);overflow:hidden}
.band .sun-set{position:absolute;right:-40px;bottom:-120px;width:420px;height:210px}
.band .grid{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:36px;padding:64px 0 72px}
.band .item{border-top:1px solid var(--muted);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.band .num{font-family:Manrope,sans-serif;font-size:14px;color:var(--sun-soft)}
.band h3{font-size:22px;font-weight:600}
.band p{margin:0;font-size:15px;color:var(--dark-text)}

/* collection */
section.block{padding:88px 0 40px}
.head-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:36px}
.head-row h2{font-size:clamp(32px,4vw,48px);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{min-height:44px;padding:0 18px;border:1px solid #B9B2A4;background:transparent;color:var(--ink);font:500 14px Inter,sans-serif;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .2s ease}
.card:hover{transform:translateY(-3px);color:var(--ink)}
.card .body{padding:20px;display:flex;flex-direction:column;gap:8px;flex-grow:1}
.card .brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card .name{font-family:Manrope,sans-serif;font-size:21px;font-weight:600;line-height:1.2}
.card .hook{font-size:14px;line-height:1.5;color:#48443D;flex-grow:1}
.card .price{font-size:18px;font-weight:600;margin-top:6px}

/* art: photo over line drawing */
.art{position:relative;background:var(--sand);aspect-ratio:1/1;overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8%}
.art.has-photo path{display:none}
.art.photo img{padding:0;object-fit:cover}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.thumbs button{padding:0;border:1px solid var(--line);background:var(--sand);cursor:pointer;aspect-ratio:1/1;overflow:hidden}
.thumbs button[aria-pressed="true"]{border:2px solid var(--ink)}
.thumbs button .art{aspect-ratio:auto;height:100%}
.thumbs img.t{width:100%;height:100%;object-fit:cover;display:block}
.art .no{position:absolute;top:14px;left:16px;font-size:12px;letter-spacing:.16em;color:var(--muted);z-index:2}

/* video */
.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.video{position:relative;aspect-ratio:9/16;max-height:520px;background:var(--ink);overflow:hidden}
.video svg{position:absolute;inset:0;width:100%;height:100%}
.video p{position:absolute;left:20px;right:20px;bottom:20px;margin:0;color:var(--bg);font-size:15px;line-height:1.4}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}

/* gift + showroom */
.gift{background:var(--sand);overflow:hidden}
.split{display:flex;flex-wrap:wrap;gap:48px;align-items:center;padding:88px 0}
.split>*{flex:1 1 380px;min-width:0}
.split h2{font-size:clamp(30px,3.6vw,44px);font-weight:600;margin-bottom:18px}
.split p{margin:0 0 16px;font-size:17px;color:var(--ink2)}
dl.info{margin:0;display:grid;grid-template-columns:120px 1fr;gap:12px 20px;align-content:start}
dl.info dt{color:var(--muted)}
dl.info dd{margin:0}
footer{border-top:1px solid #D8D2C5;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding-top:28px;padding-bottom:28px}

/* product page */
.pp{display:flex;flex-wrap:wrap;gap:56px;padding:40px 0 80px}
.pp .media{flex:1 1 480px;min-width:0}
.pp .info{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:20px}
.pp h1{font-size:clamp(38px,5vw,56px);font-weight:600}
.pp .promise{font-family:Manrope,sans-serif;font-size:23px;font-weight:500;line-height:1.3;color:var(--ink2);margin:0}
.pp .desc{margin:0;color:var(--ink2)}
.pp .price-row{display:flex;align-items:baseline;gap:14px;padding-top:16px;border-top:1px solid #D8D2C5}
.pp .price-row b{font-family:Manrope,sans-serif;font-size:36px}
.pp .price-row span{font-size:14px;color:var(--muted)}
.pp ul{margin:0;padding:0;list-style:none;color:var(--ink2);font-size:15px}
.gift-toggle{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.gift-toggle input{width:20px;height:20px;accent-color:var(--sun-btn)}
.back{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;font-size:14px;margin-top:24px}
.specs{display:flex;flex-wrap:wrap;gap:48px;padding:72px 0}
.specs>*{flex:1 1 360px;min-width:0}
.specs h2{font-size:30px;font-weight:600;margin-bottom:18px}
.why .grid{padding:64px 0 88px}
.note{font-size:13px;color:var(--muted)}

/* cart drawer */
.overlay{position:fixed;inset:0;background:rgba(27,27,26,.45);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:50;display:none;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12)}
.open .overlay{display:block}
.open .drawer{display:flex}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:22px}
.icon-btn{min-width:44px;min-height:44px;border:none;background:transparent;font-size:22px;cursor:pointer;color:var(--ink)}
.drawer .items{flex:1;overflow:auto;padding:12px 24px}
.ci{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.ci .art{width:64px;flex:none}
.ci .meta{flex:1;min-width:0}
.ci .meta b{display:block;font-family:Manrope,sans-serif;font-size:15px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:36px;height:36px;border:1px solid #B9B2A4;background:transparent;cursor:pointer;font-size:16px;color:var(--ink)}
.drawer form{padding:20px 24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.drawer label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.drawer input[type=text],.drawer input[type=tel],.drawer select{min-height:44px;border:1px solid #B9B2A4;background:var(--paper);padding:0 12px;font:16px Inter,sans-serif;color:var(--ink)}
.total{display:flex;justify-content:space-between;font-family:Manrope,sans-serif;font-size:20px;font-weight:600}
.empty{padding:40px 0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media (max-width:640px){nav.main .hide-sm{display:none}.hero{padding-top:32px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head>

/* ---- корзина ---- */
let cart = [];
try { cart = JSON.parse(localStorage.getItem('dogu-cart')||'[]'); } catch(e) { cart = []; }
function save(){ try{ localStorage.setItem('dogu-cart', JSON.stringify(cart)); }catch(e){} renderCart(); }
function addToCart(id, gift){
  const line = cart.find(l=>l.id===id && l.gift===gift);
  if (line) line.q++; else cart.push({id, gift, q:1});
  save(); toast('Добавлено в корзину');
}
function renderCart(){
  const n = cart.reduce((s,l)=>s+l.q,0);
  $('#cartCount').textContent = n;
  const total = cart.reduce((s,l)=>{const p=PRODUCTS.find(x=>x.id===l.id);return s+(p?p.price*l.q:0)},0);
  $('#cartTotal').textContent = eur(total);
  $('#cartItems').innerHTML = cart.length ? cart.map((l,i)=>{const p=PRODUCTS.find(x=>x.id===l.id); if(!p) return ''; return `<div class="ci">${art(p)}<div class="meta"><b>${esc(p.name)}</b><span class="note">${eur(p.price)}${l.gift?' · в подарочной коробке':''}</span></div><div class="qty"><button type="button" data-i="${i}" data-d="-1" aria-label="Меньше">−</button><span aria-live="polite">${l.q}</span><button type="button" data-i="${i}" data-d="1" aria-label="Больше">+</button></div></div>`}).join('') : '<p class="empty">Корзина пуста.</p>';
  $('#cartItems').querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{const l=cart[+b.dataset.i]; l.q+=+b.dataset.d; if(l.q<=0) cart.splice(+b.dataset.i,1); save();}));
  $('#orderForm').style.display = cart.length ? 'flex' : 'none';
}
function openCart(){ document.body.classList.add('open'); $('#cartClose').focus(); }
function closeCart(){ document.body.classList.remove('open'); $('#cartOpen').focus(); }
$('#cartOpen').addEventListener('click', openCart);
$('#cartClose').addEventListener('click', closeCart);
$('#overlay').addEventListener('click', closeCart);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && document.body.classList.contains('open')) closeCart(); });
$('#orderForm').addEventListener('submit', e=>{
  e.preventDefault();
  const f = new FormData(e.target);
  const lines = cart.map(l=>{const p=PRODUCTS.find(x=>x.id===l.id);return `• ${p.name} ×${l.q} — ${eur(p.price*l.q)}${l.gift?' (подарочная упаковка)':''}`});
  const total = cart.reduce((s,l)=>s+PRODUCTS.find(x=>x.id===l.id).price*l.q,0);
  const msg = `Заказ DŌGU\n${lines.join('\n')}\nИтого: ${eur(total)}\n\nИмя: ${f.get('name')}\nТелефон: ${f.get('phone')}\nПолучение: ${f.get('delivery')}`;
  window.open(`https://wa.me/${SHOP.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
});
let tt; function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),1800); }

/* ---- роутер ---- */
function route(){
  const h = location.hash.replace(/^#\/?/,'');
  if (h.startsWith('p/')) return product(h.slice(2));
  home(['collection','video','gift','showroom'].includes(h) ? h : null);
}
window.addEventListener('hashchange', route);
renderCart(); route();
</script>
