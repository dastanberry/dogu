<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex, nofollow">
<title>DŌGU — japāņu instrumenti meistariem · Rīga</title>
<meta name="description" content="Japāņu inženiertehniskie risinājumi meistariem. Vessel, Engineer, Tajima. Salons Rīgā.">
<style>
:root{--bg:#F4F1EA;--paper:#FBFAF6;--sand:#EDE8DD;--line:#E0DACE;--ink:#1B1B1A;--ink2:#3D3A34;--muted:#5B574F;--sun:#C8381F;--sun-btn:#B8321F;--sun-soft:#E26A55;--dark-text:#C8C2B5;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:inherit}
a:hover{color:var(--sun-btn)}
h1,h2,h3{font-family:var(--sans);font-weight:650;letter-spacing:-.02em;line-height:1.08;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.eyebrow{margin:0 0 10px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:500 15px var(--sans);text-decoration:none;cursor:pointer;text-align:center}
.btn:hover{color:var(--bg);opacity:.9}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--sun-btn);border-color:var(--sun-btn);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

header.top{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo span{font-weight:700;font-size:21px;letter-spacing:.2em}
nav.main{display:flex;flex-wrap:wrap;align-items:center;gap:20px;font-size:14px}
nav.main a{text-decoration:none}
.langs{display:flex;gap:2px}
.langs button{min-width:40px;min-height:40px;border:1px solid transparent;background:transparent;font:600 13px var(--sans);color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.cart-btn{border:1px solid var(--ink);background:transparent;min-height:44px;padding:0 16px;font:600 14px var(--sans);cursor:pointer;color:var(--ink)}

.hero{display:flex;flex-wrap:wrap;gap:48px;align-items:center;padding:56px 0 88px}
.hero .txt{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:24px}
.hero h1{font-size:clamp(36px,5.2vw,58px)}
.hero p.lead{margin:0;font-size:18px;color:var(--ink2);max-width:520px}
.hero .art-wrap{flex:1 1 360px;min-width:0;align-self:flex-end}
.horizon{display:block;width:100%;height:auto;max-height:140px}
.row{display:flex;flex-wrap:wrap;gap:12px}

.band{position:relative;background:var(--ink);color:var(--bg);overflow:hidden}
.band .sun-set{position:absolute;right:-40px;bottom:-120px;width:420px;height:210px}
.band .grid{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:36px;padding:64px 0 72px}
.band .item{border-top:1px solid var(--muted);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.band .num{font-size:14px;color:var(--sun-soft)}
.band h3{font-size:22px}
.band p{margin:0;font-size:15px;color:var(--dark-text)}

section.block{padding:88px 0 40px}
.head-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:36px}
.head-row h2{font-size:clamp(30px,4vw,46px)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{min-height:44px;padding:0 18px;border:1px solid #B9B2A4;background:transparent;color:var(--ink);font:500 14px var(--sans);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .2s ease}
.card:hover{transform:translateY(-3px);color:var(--ink)}
.card .body{padding:20px;display:flex;flex-direction:column;gap:8px;flex-grow:1}
.card .brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card .name{font-size:20px;font-weight:650;line-height:1.2;letter-spacing:-.01em}
.card .hook{font-size:14px;line-height:1.5;color:#48443D;flex-grow:1}
.card .price{font-size:18px;font-weight:650;margin-top:6px}

.art{position:relative;background:var(--sand);aspect-ratio:1/1;overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8%}
.art.has-photo path{display:none}
.art.photo img{padding:0;object-fit:cover}
.art .no{position:absolute;top:14px;left:16px;font-size:12px;letter-spacing:.16em;color:var(--muted);z-index:2}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.thumbs button{padding:0;border:1px solid var(--line);background:var(--sand);cursor:pointer;aspect-ratio:1/1;overflow:hidden}
.thumbs button[aria-pressed="true"]{border:2px solid var(--ink)}
.thumbs button .art{aspect-ratio:auto;height:100%}
.thumbs img.t{width:100%;height:100%;object-fit:cover;display:block}

.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.video{position:relative;aspect-ratio:9/16;max-height:520px;background:var(--ink);overflow:hidden}
.video svg{position:absolute;inset:0;width:100%;height:100%}
.video p{position:absolute;left:20px;right:20px;bottom:20px;margin:0;color:var(--bg);font-size:15px;line-height:1.4}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .consent{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:var(--dark-text);font-size:14px}

.gift{background:var(--sand);overflow:hidden}
.pack{margin:0;max-width:300px}.pack img{display:block;width:100%;height:auto}
.split{display:flex;flex-wrap:wrap;gap:48px;align-items:center;padding:88px 0}
.split>*{flex:1 1 380px;min-width:0}
.split h2{font-size:clamp(28px,3.6vw,42px);margin-bottom:18px}
.split p{margin:0 0 16px;font-size:17px;color:var(--ink2)}
dl.info{margin:0;display:grid;grid-template-columns:130px 1fr;gap:12px 20px;align-content:start}
dl.info dt{color:var(--muted)}
dl.info dd{margin:0}

footer{border-top:1px solid #D8D2C5;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 32px;padding-top:28px;padding-bottom:28px}
footer nav{display:flex;flex-wrap:wrap;gap:8px 18px}
footer nav a,footer button.linklike{color:var(--muted);text-decoration:none}
footer nav a:hover,footer button.linklike:hover{color:var(--ink)}
button.linklike{background:none;border:0;padding:0;font:inherit;cursor:pointer}

.pp{display:flex;flex-wrap:wrap;gap:56px;padding:32px 0 80px}
.pp .media{flex:1 1 480px;min-width:0}
.pp .info{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:20px}
.pp h1{font-size:clamp(32px,4.4vw,50px)}
.pp .promise{font-size:22px;font-weight:500;line-height:1.3;color:var(--ink2);margin:0}
.pp .desc{margin:0;color:var(--ink2)}
.pp .price-row{display:flex;align-items:baseline;gap:14px;padding-top:16px;border-top:1px solid #D8D2C5}
.pp .price-row b{font-size:36px;font-weight:650}
.pp .price-row span{font-size:14px;color:var(--muted)}
.pp ul{margin:0;padding:0;list-style:none;color:var(--ink2);font-size:15px}
.check{display:flex;align-items:flex-start;gap:10px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--sun-btn);flex:none}
.back{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;font-size:14px;margin-top:20px}
.specs{display:flex;flex-wrap:wrap;gap:48px;padding:72px 0}
.specs>*{flex:1 1 360px;min-width:0}
.specs h2{font-size:30px;margin-bottom:18px}
.why .grid{padding:36px 0 88px}
.note{font-size:13px;color:var(--muted)}

.legal{max-width:760px;padding:40px 0 96px}
.legal h1{font-size:clamp(30px,4vw,42px);margin-bottom:24px}
.legal h2{font-size:20px;margin:32px 0 10px}
.legal p,.legal li{color:var(--ink2)}
.legal ul{padding-left:20px}
.legal-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.legal-nav a{padding:8px 14px;border:1px solid #B9B2A4;text-decoration:none;font-size:14px}
.legal-nav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.overlay{position:fixed;inset:0;background:rgba(27,27,26,.45);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);z-index:50;display:none;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12)}
body.open .overlay{display:block}
body.open .drawer{display:flex}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:22px}
.icon-btn{min-width:44px;min-height:44px;border:none;background:transparent;font-size:24px;cursor:pointer;color:var(--ink)}
.drawer .scroll{flex:1;overflow:auto}
.drawer .items{padding:8px 24px}
.ci{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.ci .art{width:64px;flex:none}
.ci .meta{flex:1;min-width:0}
.ci .meta b{display:block;font-size:15px;line-height:1.3}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:36px;height:36px;border:1px solid #B9B2A4;background:transparent;cursor:pointer;font-size:16px;color:var(--ink)}
.drawer form{padding:16px 24px 24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.drawer label.f{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.drawer input[type=text],.drawer input[type=tel],.drawer select{min-height:44px;border:1px solid #B9B2A4;background:var(--paper);padding:0 12px;font:16px var(--sans);color:var(--ink);width:100%}
fieldset.ways{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
legend.f{font-size:13px;color:var(--muted);padding:0;margin-bottom:6px}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;color:var(--ink2)}
.sum .total{font-size:20px;font-weight:650;color:var(--ink)}
.empty{padding:40px 0;color:var(--muted)}

.cookie{position:fixed;left:16px;right:16px;bottom:16px;z-index:70;max-width:720px;margin:0 auto;background:var(--ink);color:var(--bg);padding:20px;display:none;flex-wrap:wrap;gap:14px;align-items:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.cookie.show{display:flex}
.cookie p{margin:0;flex:1 1 320px;font-size:14px;line-height:1.5;color:#E9E4DA}
.cookie a{color:#fff}
.cookie .row{flex:0 0 auto}
.cookie .btn{min-height:44px;padding:0 18px;font-size:14px}
.cookie .btn.ghost{color:var(--bg);border-color:#8A857B}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media (max-width:760px){nav.main .hide-sm{display:none}.hero{padding-top:32px;padding-bottom:40px;gap:28px}.gift .split{padding:48px 0;gap:28px}.pack{max-width:220px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head>
<body>

<header class="top">
<div class="wrap">
<a class="logo" href="#/" aria-label="DŌGU">
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="11" fill="#C8381F"/></svg>
<span>DŌGU</span>
</a>
<nav class="main" aria-label="Main" id="mainNav"></nav>
</div>
</header>

<main id="app"></main>

<footer><div class="wrap" id="footer"></div></footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="cartTitle" id="drawer"></aside>
<div class="cookie" id="cookie" role="region" aria-label="Cookies"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Скрипты всегда грузятся свежими, даже если браузер (WhatsApp, Instagram, Safari) закэшировал страницу. */
(function () {
  var v = Date.now(), files = ['js/data.js', 'js/i18n.js', 'js/app.js'], i = 0;
  (function next() {
    if (i >= files.length) return;
    var s = document.createElement('script');
    s.src = files[i++] + '?v=' + v;
    s.onload = next;
    document.body.appendChild(s);
  })();
})();
</script>
</body>
</html>
